[project]
name = "agent-harness"
version = "0.1.0"
description = "LLM agent runtime with a tested sandbox and a graded benchmark"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentkit*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
